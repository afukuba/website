research:
  heading: "Research"
  glyph: "∫"
  entries:
    - when: "2023 → Current"
      where: "University of Washington"
      location: "Seattle, WA"
      role: "Ph.D. Student in Mathematics"
      bullets:
        - "Research interests in combinatorics, algebraic geometry, and topology."
        - "Teach undergraduate mathematics and serve as a Graduate Student Representative."
    - when: "Jul 2021 → Current"
      where: "Mixed Volumes of Normal Complexes"
      role: "Collaborative project with Lauren Nowak and Dusty Ross"
      bullets:
        - >-
          Developed a theory of mixed volumes on truncations of tropical fans, called <em>normal
          complexes</em>, and extended the relationship between their (mixed) volume and (mixed) degrees of
          divisors of the corresponding Chow ring.
        - >-
          Used the theory of mixed volumes of normal complexes to provide a volume‑theoretic proof of
          the Heron–Rota–Welsh conjecture on the log‑concavity of characteristic polynomials of matroids.

